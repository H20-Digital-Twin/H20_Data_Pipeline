paths:
  candidate_jsonl: /data/h2o_data_engine/selection/artifacts/v4/candidate_v4.jsonl
  canonical_root: /data/h2o_data_engine/work/canonical/motions
  body_model_root: /data/h2o_data_engine/robot_retargeting/assets/body_models
  ply_root: "/data/h2o_data_engine/work/ply"
  visual_storage_id: elements_se_h2o_avatar_ply
  output_root: "/data/h2o_data_engine/work/robots"

robot:
  robot_id: unitree_g1

retarget:
  # Avoid a bad local solution when the first target yaw is far from the
  # MuJoCo default pose. Limb joints are still solved by the normal GMR loop.
  seed_first_frame_root_from_target: true

postprocess:
  normalize_root_xy: true
  align_min_body_origin_to_ground: true
  ground_height_m: 0.0

output:
  compression: true
  save_qpos_retarget_raw_in_diagnostics: true

quality:
  decision_mode: audit
  quaternion_norm_tolerance: 0.0001
  joint_limit_tolerance_rad: 0.0001

  # "Converged" is defined from final task residuals, not a Mink solver flag.
  ik_position_error_threshold_m: 0.05
  ik_rotation_error_threshold_rad: 0.35
  review_ik_converged_ratio_below: 0.98

  # Warning flags only during the first audit.
  root_speed_warning_mps: 5.0
  dof_speed_warning_rps: 20.0

contact:
  enabled: false
  end_effector_names:
    - left_toe_link
    - right_toe_link
    - left_wrist_yaw_link
    - right_wrist_yaw_link
  left_foot_links:
    - left_toe_link
  right_foot_links:
    - right_toe_link
